# pyproject.toml — corpus_pepys project configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
# `package-mode = false` — this repo is a service and a corpus, not a wheel.
# There is nothing to `pip install -e`; use poetry.
#
# Quick install (poetry)
# ----------------------
#   poetry install                        service runtime only
#   poetry install --extras build         + the corpus/index build toolchain
#   poetry install --extras build --with dev    full maintainer environment
#
# `dev` is a Poetry group, not an extra — `--extras dev` does not exist.
#
# Running the gate needs `--extras build`
# ---------------------------------------
# `pre-commit run --all-files` type-checks docker/ as well as src/, and
# docker/sdxl_server.py imports torch, which only arrives with the `build`
# extra. Without it `ty` fails on `torch.dtype` with no obvious connection to
# what you changed:
#
#   poetry install --extras build --with dev
#   env -u VIRTUAL_ENV -u POETRY_ACTIVE poetry run pre-commit run --all-files
#
# `poetry install --sync` without `--extras build` prunes torch and can leave
# an empty `torch/` directory behind, so `import torch` then succeeds with
# every attribute missing — a stranger failure than a plain ImportError.
#
# Build the corpus index
# ----------------------
#   make build-corpus           NLP enrichment pass (raw → enriched text)
#   make build-index            Build DiaryKG index from enriched corpus
#   make build-image            Bake index into Docker image
#   make run                    Start KGRAG service on http://localhost:8000

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

# Dev tooling is a plain, NON-optional Poetry group. This repo sets
# `package-mode = false`, so there is no wheel for an extra to pollute, and a
# bare `poetry install` giving the full dev environment is the point — that is
# the shape FLEET_STANDARDS.md prescribes for non-package repos.
#
# It used to be a PEP 621 `dev` extra, on the grounds that gutenberg_kg did the
# same. gutenberg_kg migrated to a group on 2026-08-13, so that reasoning
# expired; the note asserting it is removed with it.

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
ty = ">=0.0.41"
pre-commit = ">=4.5.1"
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
# Capped below 0.16 to match the fleet: 0.16 began formatting Python inside
# Markdown code blocks, which rewrites prose docs on `ruff format`.
ruff = ">=0.4.0,<0.16"

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "corpus-pepys"
version = "0.5.1"
description = "Samuel Pepys Diary — interactive semantic knowledge graph and KGRAG corpus"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@mac.com" }
]
keywords = ["knowledge-graph", "samuel-pepys", "diary", "nlp", "semantic-search", "sqlite-vec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "kgmodule-utils[synthesis,sqlite-vec]>=0.18.0",
    "openai>=1.95.0",
    "pillow>=11.0.0",
    "pydantic>=2.8.0",
    "PyYAML>=6.0",
    "rich>=14.0.0,<15",
    # Floor is 1.41, not 1.35: docker/chat.py calls st.image(..., use_container_width=True),
    # and that keyword did not exist on st.image before 1.41 — 1.35 only has the
    # deprecated use_column_width, so "Render response" died with a TypeError on
    # any env that honoured the old floor. Raised to 1.59 to match gutenberg_kg
    # (and what poetry.lock already resolves), and capped below 2 because the
    # chat UI is verified against 1.x only; streamlit ships breaking majors.
    "streamlit>=1.59,<2",
    # Native-event file watching for streamlit. Installed in the image and
    # declared by gutenberg_kg's [chat] extra; it was missing here, so a non-Docker
    # `make chat` fell back to polling.
    "watchdog>=6.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Corpus/index build toolchain — NOT needed to run the service, which only
# reads the pre-built .diarykg/ index. Kept out of the runtime deps because
# diary-kg drags in the full spaCy/thinc NLP stack.
#
# This project is canonical; docker/Dockerfile follows it. The index is
# produced here and consumed there, and doc-kg >=0.18.2 changed the vector
# store layout (LanceDB retired → file-shaped vectors.sqlite), so building
# with a version older than the container's emits an index it cannot open.
# When a floor moves here, move the matching ARG in docker/Dockerfile in the
# same commit — the container pins with `==`, so it cannot drift upward on
# its own, and a yanked release would not route around it.
build = [
    "diary-kg>=0.97.0",
    "doc-kg>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/Flux-Frontiers/corpus_pepys"
Repository = "https://github.com/Flux-Frontiers/corpus_pepys"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks inside Markdown as stable behaviour
# (0.15 gates it behind preview). The ruff-format pre-commit hook here runs with
# pass_filenames: false + always_run: true, i.e. `ruff format` over the whole
# repo — so the day that hook's rev moves past 0.16 it starts rewriting README.md
# and CHANGELOG.md snippets, a failure that looks unrelated to whatever change
# triggered it. Doc snippets are illustrative and often deliberately aligned.
# gutenberg_kg, doc_kg and ftree_kg carry the same exclusion.
exclude        = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE", "B023"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["docker"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies",
]

# ---------------------------------------------------------------------------
# DocKG index configuration
# ---------------------------------------------------------------------------
[tool.dockg]
exclude = [
    ".diarykg", ".dockg", ".git", ".mypy_cache", ".pytest_cache", ".venv",
    "__pycache__", "data", "dist", "venv",
]
