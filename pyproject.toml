# pyproject.toml — corpus_pepys project configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
# Last Revision: 2026-08-03
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Quick install (pip)
# -------------------
#   pip install -e ".[dev]"     core + dev tools
#   pip install -e "."          core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install --all-extras
#   poetry install --extras "dev"
#   poetry install
#
# First-time setup
# ----------------
#   python -m venv .venv
#   source .venv/bin/activate
#   pip install -e ".[dev]"
#
# Build the corpus index
# ----------------------
#   make build-corpus           NLP enrichment pass (raw → enriched text)
#   make build-index            Build DiaryKG index from enriched corpus
#   make build-image            Bake index into Docker image
#   make run                    Start KGRAG service on http://localhost:8000

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

# NOTE: there is deliberately no [tool.poetry.group.dev.dependencies]. The dev
# tools are declared ONCE, in the PEP 621 `dev` extra below — the same shape
# gutenberg_kg uses. Declaring them in both places meant two floors to keep in
# step for the same six packages (and they had already drifted from the fleet:
# the group said pytest>=8 while gutenberg_kg's dev extra says >=9.0.3).
# `make install-dev` picks them up via `poetry install --all-extras`.

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "corpus-pepys"
version = "0.5.1"
description = "Samuel Pepys Diary — interactive semantic knowledge graph and KGRAG corpus"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@mac.com" }
]
keywords = ["knowledge-graph", "samuel-pepys", "diary", "nlp", "semantic-search", "sqlite-vec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "kgmodule-utils[synthesis,sqlite-vec]>=0.10.0",
    "openai>=1.95.0",
    "pillow>=11.0.0",
    "pydantic>=2.8.0",
    "PyYAML>=6.0",
    "rich>=14.0.0,<15",
    # Floor is 1.41, not 1.35: docker/chat.py calls st.image(..., use_container_width=True),
    # and that keyword did not exist on st.image before 1.41 — 1.35 only has the
    # deprecated use_column_width, so "Render response" died with a TypeError on
    # any env that honoured the old floor. Raised to 1.59 to match gutenberg_kg
    # (and what poetry.lock already resolves), and capped below 2 because the
    # chat UI is verified against 1.x only; streamlit ships breaking majors.
    "streamlit>=1.59,<2",
    # Native-event file watching for streamlit. Installed in the image and
    # declared by gutenberg_kg's [chat] extra; it was missing here, so a non-Docker
    # `make chat` fell back to polling.
    "watchdog>=6.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Corpus/index build toolchain — NOT needed to run the service, which only
# reads the pre-built .diarykg/ index. Kept out of the runtime deps because
# diary-kg drags in the full spaCy/thinc NLP stack.
#
# These floors MUST stay in step with the pins in docker/Dockerfile: the index
# is produced here and consumed there, and doc-kg >=0.18.2 changed the vector
# store layout (LanceDB retired → file-shaped vectors.sqlite). Building with a
# version older than the container's emits an index it cannot open.
build = [
    "diary-kg>=0.96.0",
    "doc-kg>=0.21.1",
]
dev = [
    "detect-secrets>=1.5.0",
    "ty>=0.0.41",
    "pre-commit>=4.5.1",
    # Tracks gutenberg_kg's dev extra so the fleet lints and tests on one
    # toolchain. pytest 9 is what both locks already resolve.
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Flux-Frontiers/corpus_pepys"
Repository = "https://github.com/Flux-Frontiers/corpus_pepys"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks inside Markdown as stable behaviour
# (0.15 gates it behind preview). The ruff-format pre-commit hook here runs with
# pass_filenames: false + always_run: true, i.e. `ruff format` over the whole
# repo — so the day that hook's rev moves past 0.16 it starts rewriting README.md
# and CHANGELOG.md snippets, a failure that looks unrelated to whatever change
# triggered it. Doc snippets are illustrative and often deliberately aligned.
# gutenberg_kg, doc_kg and ftree_kg carry the same exclusion.
exclude        = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE", "B023"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["docker"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies",
]

# ---------------------------------------------------------------------------
# DocKG index configuration
# ---------------------------------------------------------------------------
[tool.dockg]
exclude = [
    ".diarykg", ".dockg", ".git", ".mypy_cache", ".pytest_cache", ".venv",
    "__pycache__", "data", "dist", "venv",
]
