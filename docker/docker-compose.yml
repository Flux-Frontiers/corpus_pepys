# corpus_pepys — local dev compose
#
# Usage (fast path — index already baked into image):
#   docker compose up
#
# Usage (bind-mount for index development):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Query:
#   curl -s -X POST http://localhost:8000/runsync \
#     -H "Content-Type: application/json" \
#     -d '{"input":{"query":"Great Fire of London","corpus":"diary","k":5}}' | jq .

name: corpuspepys

services:
  pepys-worker:
    image: corpus-pepys:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # No `args:` on purpose. The KG package pins live in ONE place — the ARG
      # defaults in docker/Dockerfile — so a compose-triggered build and
      # `make build-image` (plain `docker build`, no args) produce the same
      # image. A second copy here is how gutenberg_kg drifted to
      # kgmodule-utils 0.4.6 while its Dockerfile said 0.5.0; the copy that used
      # to sit here (KGMODULE_UTILS_VERSION: 0.10.0) was the same trap, one
      # `poetry update` away from springing. scripts/check_pins.py still checks
      # compose for stray *_VERSION args, so re-adding one is caught.
    # -u so the worker's startup/query prints reach `docker compose logs`
    # unbuffered — matches the Dockerfile CMD and the Apple `container` path.
    command: python -u handler.py --rp_serve_api --rp_api_host 0.0.0.0
    ports:
      - "8000:8000"
    environment:
      PEPYS_KG_ROOT: /workspace/pepys
      EMBED_MODEL: BAAI/bge-small-en-v1.5
      HANDLER_SECRET: ${HANDLER_SECRET:-}
      # Pinned to INFO. runpod's own default is DEBUG, which echoes the entire
      # handler response into the logs — and its logger caps a message at 4096
      # chars, cutting the middle out with "...TRUNCATED N CHARACTERS...". That
      # reads like results went missing when the HTTP response is in fact
      # complete. Set RUNPOD_LOG_LEVEL=DEBUG in docker/.env to get the echo back.
      RUNPOD_LOG_LEVEL: ${RUNPOD_LOG_LEVEL:-INFO}
      # Synthesis via a host LLM server (optional — omit to disable).
      # Defaults target oMLX on :8080; see docker/.env.example.
      VLLM_ENDPOINT_URL: ${VLLM_ENDPOINT_URL:-http://host.docker.internal:8080/v1}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen3-4B-Instruct-2507-MLX-8bit}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Image generation via mflux-serve on the host (optional — omit to disable).
      IMAGE_ENDPOINT: ${IMAGE_ENDPOINT:-http://host.docker.internal:8090}
      IMAGE_STEPS: ${IMAGE_STEPS:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional Streamlit chat UI — matches kgrag/local/chat.py interface
  pepys-chat:
    image: corpus-pepys:latest
    command: >
      streamlit run /app/chat.py
      --server.port 8501
      --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      KGRAG_ENDPOINT: http://pepys-worker:8000
      # Must match the worker's. chat.py reads HANDLER_SECRET and puts it in
      # every request body; the worker rejects a mismatch with
      # {"error": "unauthorized"}. Without this line a HANDLER_SECRET set for
      # the worker made the chat UI fail every query while curl still worked.
      HANDLER_SECRET: ${HANDLER_SECRET:-}
      # mflux-server runs on the host Mac; host.docker.internal bridges to it.
      # Read by the worker, not by chat.py — image generation is routed through
      # the worker's "imagine" op — but kept in step with it so the two agree.
      IMAGE_ENDPOINT: ${IMAGE_ENDPOINT:-http://host.docker.internal:8090}
      IMAGE_STEPS: ${IMAGE_STEPS:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pepys-worker
    profiles:
      - chat
