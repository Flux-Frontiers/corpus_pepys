name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint & type-check
  # Full poetry install is skipped — ruff and ty are installed directly.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install "ruff>=0.4.0" "ty>=0.0.41"

      # Scope matches `make lint` plus tests/. CI previously checked docker/
      # only, so a lint error in scripts/ or tests/ passed CI and then failed
      # on the contributor's machine at `make lint` / pre-commit.
      - name: ruff — check
        run: ruff check docker/ scripts/ tests/

      - name: ruff — format
        run: ruff format --check docker/ scripts/ tests/

      - name: ty
        run: ty check docker/

  # ---------------------------------------------------------------------------
  # Tests
  # Only pytest and httpx are installed: tests/conftest.py stubs runpod, kg_rag,
  # kg_utils and streamlit into sys.modules at collection time, so the suite
  # never imports the real KGRAG stack (and never pulls torch into CI).
  # httpx is real rather than stubbed — it is small and pure-Python, and
  # tests/test_chat.py asserts on its exception types, which a mock cannot model.
  # fastapi (with pydantic) likewise: docker/sdxl_server.py declares its request
  # model with pydantic, and tests/test_sdxl_server.py asserts on those defaults,
  # which is the contract the worker depends on. Both are already declared
  # runtime dependencies in pyproject.toml; torch and diffusers are NOT needed,
  # because sdxl_server defers them until an actual render.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install "pytest>=9.0.3" "httpx>=0.27.0" "fastapi>=0.116.0" "pydantic>=2.8.0"

      - name: Run tests
        run: pytest

  # ---------------------------------------------------------------------------
  # Docker artefact validation
  # Full image build is skipped — it requires the baked-in .diarykg/ index
  # which is generated locally and gitignored.  We lint the Dockerfile with
  # hadolint and verify that docker-compose parses cleanly instead.
  # ---------------------------------------------------------------------------
  docker:
    name: Validate Docker artefacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          # DL3013: pip version pinning — managed by poetry.lock, not the Dockerfile
          # DL3059: consolidate RUN steps — embedding pre-download is intentionally layered
          # DL3008: apt version pinning — libgomp1/libglib2.0-0 are stable Debian
          #   runtime shared-libs pulled in only to satisfy the torch and pyarrow
          #   wheels. Pinning them would break the build on every python:3.12-slim
          #   refresh, and the base image digest is what actually fixes them. This
          #   rule first applied when the image stopped extending kgrag-worker and
          #   grew its own apt-get layer.
          ignore: DL3013,DL3059,DL3008

      - name: Validate docker-compose syntax
        run: docker compose -f docker/docker-compose.yml config --quiet
